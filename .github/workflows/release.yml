name: Release

# 打 tag 就发版：校验版本号 → 构建模块包 → 建 Release 并挂上 zip。
# 说明文件放在 release-notes/<tag>.md，没有就自动按提交历史生成。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag（例如 v1.3.3）；用于补发或重新上传包
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Check tag matches package.json
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          want="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$want" ]; then
            echo "::error::tag $TAG 与 package.json 的版本 $want 不一致，先改 version 再打 tag"
            exit 1
          fi

      - name: Build module zip
        run: npm run package

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          title="App Systemizer ${TAG#v}"
          notes="release-notes/$TAG.md"
          # 补发旧 tag 时说明文件可能只存在于 main，从 API 取一份
          if [ ! -f "$notes" ] && gh api "repos/$GITHUB_REPOSITORY/contents/$notes?ref=main" --jq .content >/tmp/notes.b64 2>/dev/null; then
            base64 -d /tmp/notes.b64 > /tmp/notes.md && notes=/tmp/notes.md
            echo "using release notes from main"
          fi
          ls -l dist/*.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 已存在就覆盖附件，方便补发；有说明文件才覆盖正文
            gh release upload "$TAG" dist/*.zip --clobber
            if [ -f "$notes" ]; then
              gh release edit "$TAG" --title "$title" --notes-file "$notes"
            else
              gh release edit "$TAG" --title "$title"
            fi
          elif [ -f "$notes" ]; then
            gh release create "$TAG" dist/*.zip --verify-tag --title "$title" --notes-file "$notes"
          else
            gh release create "$TAG" dist/*.zip --verify-tag --title "$title" --generate-notes
          fi
          gh release view "$TAG" --json url,assets \
            --jq '.url, (.assets[] | "asset: \(.name) \(.size)B")'
