name: Release

# 打 tag 就发版：校验版本号 → 构建模块包 → 建 Release 并挂上 zip。
# 说明取 CHANGELOG.md 里对应版本的小节，没有就按提交历史自动生成。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag（例如 v1.5.0）；用于补发或重新上传包
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Check tag matches package.json
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          want="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$want" ]; then
            echo "::error::tag $TAG 与 package.json 的版本 $want 不一致，先改 version 再打 tag"
            exit 1
          fi

      - name: Build module zip
        run: npm run package

      - name: Write update.json
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG;
            const version = tag.replace(/^v/, "");
            const [major, minor, patch] = version.split(".").map(Number);
            const repo = process.env.GITHUB_REPOSITORY;
            const update = {
              version,
              versionCode: major * 1000000 + minor * 1000 + patch,
              zipUrl: `https://github.com/${repo}/releases/download/${tag}/App-Systemizer-KSU-${tag}.zip`,
              changelog: `https://github.com/${repo}/releases/download/${tag}/changelog.md`,
            };
            fs.writeFileSync("dist/update.json", JSON.stringify(update, null, 2) + "\n");
          '
          cat dist/update.json

      - name: Extract release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # 取 CHANGELOG 里 "## <version>" 到下一个 "## " 之间的内容
          awk -v v="$version" '
            $0 ~ "^## " v "([^0-9.]|$)" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ -s /tmp/notes.md ]; then
            echo "using CHANGELOG section for $TAG"
          else
            rm -f /tmp/notes.md
            echo "no CHANGELOG section for $TAG, falling back to generated notes"
          fi

      - name: Prepare changelog asset
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -f /tmp/notes.md ]; then
            # 去掉 Markdown 记号，管理器里直接显示纯文本
            sed -e 's/^### //' -e 's/^## //' -e 's/^- /• /' -e 's/\*\*//g' /tmp/notes.md > dist/changelog.md
          else
            printf 'App Systemizer %s\n\n完整说明见 Release 页面。\n' "${TAG#v}" > dist/changelog.md
          fi
          cat dist/changelog.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          title="App Systemizer ${TAG#v}"
          notes=/tmp/notes.md
          assets=(dist/*.zip dist/update.json dist/changelog.md)
          ls -l "${assets[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 已存在就覆盖附件，方便补发；有说明才覆盖正文
            gh release upload "$TAG" "${assets[@]}" --clobber
            if [ -f "$notes" ]; then
              gh release edit "$TAG" --title "$title" --notes-file "$notes"
            else
              gh release edit "$TAG" --title "$title"
            fi
          elif [ -f "$notes" ]; then
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "$title" --notes-file "$notes"
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "$title" --generate-notes
          fi
          gh release view "$TAG" --json url,assets \
            --jq '.url, (.assets[] | "asset: \(.name) \(.size)B")'
